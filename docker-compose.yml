services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aquacrop_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/aquacrop.db
      - APP_NAME=AquaCrop
      - ENVIRONMENT=development
      - OTP_DEV_PRINT=true
      - GROQ_MODEL=llama-3.1-8b-instant
    volumes:
      - sqlite_data:/app/data
      - ./backend:/app/backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aquacrop_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - BACKEND_PROXY_TARGET=http://backend:8000
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  sqlite_data:
