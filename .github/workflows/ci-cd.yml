name: AquaCrop CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio requests

      - name: Run Pytest Unit Tests
        run: |
          pytest backend/tests/

      - name: Run E2E Regression Integration Test
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          ENVIRONMENT: "testing"
          OTP_DEV_PRINT: "true"
        run: |
          cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 4
          python backend/test_e2e_regression.py

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Production Frontend
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Stack
        run: |
          docker compose build
